name: Naukri Resume Updater

on:
  workflow_dispatch:      # Manual trigger option

jobs:
  update-resume:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate secrets and resume file
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        RESUME_FILE_NAME: ${{ secrets.RESUME_FILE_NAME }}
      run: |
        test -n "$NAUKRI_EMAIL" || (echo "Missing secret: NAUKRI_EMAIL" && exit 1)
        test -n "$NAUKRI_PASSWORD" || (echo "Missing secret: NAUKRI_PASSWORD" && exit 1)
        test -n "$RESUME_FILE_NAME" || (echo "Missing secret: RESUME_FILE_NAME" && exit 1)
        RESUME_PATH="src/main/resources/$RESUME_FILE_NAME"
        test -f "$RESUME_PATH" || (echo "Resume file not found: $RESUME_PATH" && ls -la src/main/resources && exit 1)

    - name: Run Resume Updater
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        RESUME_FILE_NAME: ${{ secrets.RESUME_FILE_NAME }}
      run: mvn -B -q -DskipTests compile exec:java "-Dexec.args=--headless"

