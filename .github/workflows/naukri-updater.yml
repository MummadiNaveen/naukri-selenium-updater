name: Naukri Resume Updater

on:
  schedule:
    - cron: '30 0 * * *'  # Runs daily at 6:00 AM IST (00:30 UTC)
  workflow_dispatch:      # Manual trigger option

jobs:
  update-resume:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Resume Updater
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        RESUME_FILE_NAME: ${{ secrets.RESUME_FILE_NAME }}
      run: mvn -q exec:java "-Dexec.args=--headless"

